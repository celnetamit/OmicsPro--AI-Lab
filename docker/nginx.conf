# Rendered by the nginx image's envsubst entrypoint: ${API_UPSTREAM} and
# ${PORT} come from the environment.
server {
    listen ${PORT};
    # Also 80, the port a reverse proxy assumes when a domain is saved without
    # one (in Coolify, "https://host" rather than "https://host:8080"). Without
    # it that one omission is a 502 on every page.
    listen 80;
    server_name _;

    # Docker's embedded DNS, asked when a request arrives rather than once at
    # start-up. With a fixed "proxy_pass http://api:8000" nginx refuses to start
    # if the API is not resolvable at that moment, and the whole site goes down
    # with it. Resolved per request, the app still loads while the API starts or
    # restarts, /api answers 502 until it is back, and a restarted API's new
    # address is picked up within ten seconds.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream ${API_UPSTREAM};
    root /usr/share/nginx/html;
    index index.html;

    # The API is behind the same origin, so the browser never issues a
    # cross-origin request and no CORS configuration can break the app.
    location /api/ {
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A pipeline run is queued rather than executed in the request, but
        # dataset loading and report generation are still measured in seconds.
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        client_max_body_size 512m;   # analysis-ready uploads (Expert tier)
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # Fingerprinted assets are immutable; everything else must revalidate so a
    # redeploy is picked up on the next navigation.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff";
        add_header X-Frame-Options "DENY";
        add_header Referrer-Policy "strict-origin-when-cross-origin";
        add_header Permissions-Policy "geolocation=(), microphone=(), camera=()";
        # The app loads no third-party script, style, font or frame. The API is
        # proxied through this same origin, so connect-src is 'self' plus the
        # one off-origin host the browser does talk to: NanoSchool, for the
        # feedback, reviewer agreement and expert review screens. ${HUB_ORIGIN}
        # is set from the same value the bundle was built with, so the policy
        # cannot drift from the address the code calls.
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' ${HUB_ORIGIN}; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'";
        # Client-side routing: unknown paths are React Router's to resolve.
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;
}
