name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: API tests and guardrails
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
      - run: pip install -r backend/requirements.txt
      - name: Clustering runtimes
        # The guided Core, Advanced and communication pipelines cluster with
        # leidenalg and lay out cells with UMAP, so the tests that assert a run
        # completes need both present.
        # Without it those runs fail cleanly naming the missing method — correct
        # behaviour, but not what those tests are checking. Versions come from
        # requirements-science.txt so the locked pins stay in one place.
        run: grep -E '^(igraph|leidenalg|umap-learn|pynndescent|anndata)==' backend/requirements-science.txt | xargs pip install
      - name: Naming rule and parameter registry guardrails
        run: python scripts/lint_naming.py
      - name: Tests
        env:
          PYTHONPATH: backend
        run: python -m pytest backend/tests -q
      - name: Migrations match the models
        # A model change without a migration is a deployment that fails at boot.
        working-directory: backend
        env:
          PYTHONPATH: .
          OMICSLAB_DATABASE_URL: sqlite:///./ci-check.db
        run: |
          alembic upgrade head
          alembic check

  frontend:
    name: Web build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck
      - run: npm test
        working-directory: frontend
      - run: npm run build
        working-directory: frontend

  images:
    name: Container images build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: API image
        run: docker build -f backend/Dockerfile -t omicslab-api:ci .
      - name: Web image
        run: docker build -f frontend/Dockerfile -t omicslab-web:ci .
      - name: The API image refuses an unsafe production configuration
        # The container must exit, not hang: a service that neither serves nor
        # dies is the failure mode an orchestrator cannot report. The timeout
        # is the assertion — without the entrypoint's preflight this hangs.
        run: |
          set +e
          timeout 90 docker run --rm -e OMICSLAB_ENVIRONMENT=production \
            -e OMICSLAB_SKIP_MIGRATIONS=true omicslab-api:ci > refusal.log 2>&1
          code=$?
          set -e
          cat refusal.log
          if [ "$code" = "0" ]; then
            echo "::error::The image started in production mode with the development signing key."
            exit 1
          fi
          if [ "$code" = "124" ]; then
            echo "::error::The image hung instead of refusing an unusable configuration."
            exit 1
          fi
          grep -q "OMICSLAB_JWT_SECRET" refusal.log || {
            echo "::error::It exited, but not for the reason under test."; exit 1; }
          echo "Refused immediately, as intended (exit $code)."
